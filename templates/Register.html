<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | AgriGPT</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            padding: 40px;
        }
        .container {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }
        h2 {
            text-align: center;
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            margin-top: 20px;
            width: 100%;
            padding: 10px;
            background: #28a745;
            color: white;
            border: none;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #218838;
        }
        .login-link {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Farmer Registration</h2>
        <form method="POST" action="/register">
            <label for="user_id">User ID</label>
            <input type="text" id="user_id" name="user_id" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>

            <label for="land_owned">Land Owned (in acres)</label>
            <input type="number" step="0.01" id="land_owned" name="land_owned" required>

            <label for="organic_farming">Practices Organic Farming?</label>
            <select id="organic_farming" name="organic_farming">
                <option value="yes">Yes</option>
                <option value="no">No</option>
            </select>

            <label for="kcc">Kisan Credit Card (KCC) Holder?</label>
            <select id="kcc" name="kcc">
                <option value="yes">Yes</option>
                <option value="no">No</option>
            </select>

            <label for="community">Community</label>
            <select id="community" name="community" required>
                <option value="general">General</option>
                <option value="obc">OBC</option>
                <option value="sc">SC</option>
                <option value="st">ST</option>
            </select>

            <button type="submit">Register</button>
        </form>
        <div class="login-link">
            Already registered? <a href="/login">Login here</a>
        </div>
    </div>
</body>
</html>
