<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <title>Agricultural Chatbot Interface</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../static/chat/reset.css" />
  <link rel="stylesheet" href="../static/chat/variables.css" />
  <link rel="stylesheet" href="../static/chat/style.css" />
  <link rel="stylesheet" href="../static/chat/chat.css" />
  <link rel="stylesheet" href="../static/chat/animations.css" />
  <link rel="stylesheet" href="../static/chat/responsive.css" />
</head>
<body>
  <div class="app-container">
    <div class="app-bg"></div>
    <header class="site-header">
      <nav class="nav-container">
        <a href="/" class="home-button" id="homeButton">
          <span class="home-icon"></span>
          <span class="home-text" data-lang-key="home">Home</span>
        </a>
        <button class="language-toggle" id="languageToggle">
          <span class="current-lang">English</span>
          <span class="toggle-icon"></span>
        </button>
      </nav>
    </header>

    <main class="chatbot-container">
      <div class="chatbot-header">
        <div class="chatbot-avatar">
          <div class="avatar-icon bot-avatar"></div>
        </div>
        <div class="chatbot-info">
          <h1 class="chatbot-title" data-lang-key="chatbot-title">Agricultural Assistant</h1>
          <p class="chatbot-subtitle" data-lang-key="chatbot-subtitle">Ask me anything about farming</p>
        </div>
      </div>

      <div class="chat-window" id="chatWindow">
        <div class="welcome-message">
          <p data-lang-key="welcome-message">Hi! Ask me about your farm in Tamil or English.</p>
        </div>
      </div>

      <div class="chat-controls">
        <div class="voice-status" id="voiceStatus">
          <div class="listening-indicator">
            <span class="listening-dot"></span>
            <span class="listening-dot"></span>
            <span class="listening-dot"></span>
          </div>
          <p class="listening-text" data-lang-key="listening">Listening...</p>
        </div>

        <div class="input-container">
          <textarea
            id="userInput"
            class="user-input"
            placeholder="Type your message here..."
            data-lang-key="input-placeholder"
            rows="1"
          ></textarea>
          <button id="sendButton" class="send-button">
            <span class="send-icon"></span>
          </button>
        </div>

        <div class="voice-controls">
          <button id="micButton" class="mic-button" aria-label="Start voice input">
            <span class="mic-icon"></span>
            <span class="mic-pulse"></span>
          </button>
          <button id="speakerButton" class="speaker-button" aria-label="Toggle text-to-speech">
            <span class="speaker-icon"></span>
            <span class="speaker-wave"></span>
          </button>
          <!-- <div class="voice-settings">
  <label>Pitch: <input type="range" id="voicePitch" min="0.5" max="2" step="0.1" value="1"></label>
  <label>Speed: <input type="range" id="voiceRate" min="0.5" max="2" step="0.1" value="1"></label>
</div> -->

        </div>
      </div>
    </main>
  </div>

  <script src="../static/chat/utils.js"></script>
  <script src="../static/chat/translations.js"></script>
  <script src="../static/chat/animations.js"></script>

  <script>
  let isProcessingMessage = false;

  document.addEventListener('DOMContentLoaded', () => {
    const userInput = document.getElementById('userInput');
    const sendButton = document.getElementById('sendButton');
    const chatWindow = document.getElementById('chatWindow');
    const micButton = document.getElementById('micButton');
    const speakerButton = document.getElementById('speakerButton');

    // Preload voices
    let voices = [];

    function loadVoices() {
      voices = window.speechSynthesis.getVoices();
      if (!voices.length) {
        // Some browsers need a timeout to load voices
        setTimeout(() => {
          voices = window.speechSynthesis.getVoices();
        }, 250);
      }
    }

    if (window.speechSynthesis) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
      loadVoices();
    }

    sendButton.addEventListener('click', sendUserMessage);

    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendUserMessage();
      }
    });

    if (micButton) {
      micButton.addEventListener('click', handleVoiceInput);
    }

    if (speakerButton) {
      speakerButton.addEventListener('click', () => {
        speakerButton.classList.toggle('active');
      });
    }

    function sendUserMessage() {
      const message = userInput.value.trim();
      if (!message || isProcessingMessage) return;

      addMessageToChat('user', message);
      userInput.value = '';
      userInput.style.height = 'auto';

      fetch('/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message })
      })
        .then(res => res.json())
        .then(data => {
          const reply = data.response || "Sorry, something went wrong.";
          addMessageToChat('bot', reply);

          if (speakerButton.classList.contains('active')) {
            speakText(reply);
          }
        })
        .catch(err => {
          console.error(err);
          addMessageToChat('bot', "⚠️ Server error. Please try again.");
        })
        .finally(() => {
          isProcessingMessage = false;
        });
    }

    function handleVoiceInput() {
      const voiceStatus = document.getElementById('voiceStatus');
      if (voiceStatus) voiceStatus.classList.add('active');

      fetch('/voice_input')
        .then(res => res.json())
        .then(data => {
          const transcript = data.transcript;
          if (transcript) {
            addMessageToChat('user', transcript);
            fetch('/ask', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ message: transcript })
            })
              .then(res => res.json())
              .then(data => {
                const reply = data.response || "Sorry, something went wrong.";
                addMessageToChat('bot', reply);

                if (speakerButton.classList.contains('active')) {
                  speakText(reply);
                }
              });
          }
        })
        .catch(error => {
          console.error("Voice input error:", error);
          addMessageToChat('bot', "🎙️ Voice input failed.");
        })
        .finally(() => {
          if (voiceStatus) voiceStatus.classList.remove('active');
        });
    }

    function speakText(text) {
  const pitch = parseFloat(document.getElementById('voicePitch')?.value || 1);
  const rate = parseFloat(document.getElementById('voiceRate')?.value || 1);

  fetch('/speak', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text })
  })
    .then(res => res.blob())
    .then(blob => {
      const url = URL.createObjectURL(blob);
      const audio = new Audio(url);
      audio.playbackRate = rate;
      audio.preservesPitch = true;

      // Use Web Audio API to control pitch
      const context = new (window.AudioContext || window.webkitAudioContext)();
      const source = context.createMediaElementSource(audio);
      const pitchShifter = context.createBiquadFilter();
      pitchShifter.type = "allpass";
      pitchShifter.frequency.value = pitch * 1000; // approximate pitch effect

      source.connect(pitchShifter).connect(context.destination);

      audio.play();
    })
    .catch(err => {
      console.error("Audio playback error:", err);
    });
}

    function addMessageToChat(sender, text) {
      const messageContainer = document.createElement('div');
      messageContainer.className = `message-container ${sender}-message`;

      const timestamp = new Date().toLocaleTimeString([], {
        hour: '2-digit',
        minute: '2-digit'
      });

      messageContainer.innerHTML = sender === 'bot'
        ? `
          <div class="avatar-container">
            <div class="avatar-icon bot-avatar"></div>
          </div>
          <div class="message-content">
            <div class="message-text">${text}</div>
            <div class="message-timestamp">${timestamp}</div>
          </div>
        `
        : `
          <div class="message-content">
            <div class="message-text">${text}</div>
            <div class="message-timestamp">${timestamp}</div>
          </div>
          <div class="avatar-container">
            <div class="avatar-icon user-avatar"></div>
          </div>
        `;

      chatWindow.appendChild(messageContainer);
      chatWindow.scrollTop = chatWindow.scrollHeight;
    }
  });
</script>

</body>
</html>
